name: Update and deploy

on:
  # A push only rebuilds and deploys: the data it needs is already committed by the scheduled runs.
  push:
    branches: [main]
  schedule:
    # Off the hour: GitHub delays or drops more scheduled runs at :00.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A League that fails keeps its last good data while the rest still commit and deploy; the last step then turns the job red.
      - id: update
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run update
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      # Commit only when something other than the updatedAt timestamp changed.
      - if: github.event_name != 'push'
        run: |
          git add data
          if ! git diff --cached --quiet -I'"updatedAt"'; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "Update data"
            git push
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
      - if: steps.update.outcome == 'failure'
        run: |
          echo "::error::Update failed for at least one League, named above"
          exit 1
